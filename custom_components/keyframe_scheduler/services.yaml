set_schedule:
  name: Set schedule
  description: Update the schedule for a Keyframe Scheduler instance
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the scheduler instance
      required: true
      example: "abc123def456"
      selector:
        text:
    schedule:
      name: Schedule JSON
      description: The schedule as a JSON string or dict
      required: true
      example: '{"version": 1, "timezone": "Europe/Berlin", "stepMinutes": 5, "keyframes": [...]}'
      selector:
        object:

upload_from_file:
  name: Upload schedule from file
  description: Upload a JSON schedule file from the file system (e.g., /config/schedules/my-schedule.json)
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID (find in sensor attributes - state_attr('sensor.INSTANCE_target_kelvin', 'entry_id'))
      required: true
      example: "abc123def456"
      selector:
        text:
    file_path:
      name: File Path
      description: Full path to JSON file in /config/ directory
      required: true
      example: "/config/schedules/living-room.json"
      selector:
        text:

apply:
  name: Apply schedule now
  description: >
    Send the current schedule values to the lights of an instance right away
    (only lights that are on and follow the schedule; paused lights stay paused).
  fields:
    entry_id:
      name: Entry ID
      description: Limit to one scheduler instance (optional)
      required: false
      selector:
        text:
    entity_id:
      name: Lights
      description: Limit to these lights (optional)
      required: false
      selector:
        entity:
          domain: light
          multiple: true

set_manual_control:
  name: Set manual control
  description: >
    Pause (manual true) or resume (manual false) following the schedule for
    lights. A paused light keeps its current state; resuming sends the
    current schedule values at once.
  fields:
    entity_id:
      name: Lights
      description: The lights to pause or resume
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    manual:
      name: Manual control
      description: true = pause (manual control), false = follow the schedule again
      required: false
      default: true
      selector:
        boolean:
    entry_id:
      name: Entry ID
      description: Limit to one scheduler instance (optional)
      required: false
      selector:
        text:

turn_on:
  name: Turn on with the schedule
  description: >
    Switch lights on with the schedule's current values, so they come on
    right instead of with their stored state and a correction a second later.
    Use it in place of light.turn_on in automations (wall buttons, presence).
    Every light gets what it can show; a paused light follows again. Lights
    no instance controls are switched on normally.
  fields:
    entity_id:
      name: Lights
      description: Lights, light groups or members of an assigned group
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    transition:
      name: Transition
      description: Fade when switching on, in seconds (default 0 — a fade from off is unreliable on some systems, e.g. Hue rooms)
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: s

toggle:
  name: Toggle with the schedule
  description: >
    Off if the light (or any light of the group) is on, otherwise on with the
    schedule's current values — the drop-in for light.toggle on a wall button.
  fields:
    entity_id:
      name: Lights
      description: Lights, light groups or members of an assigned group
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    transition:
      name: Transition
      description: Fade in seconds (default 0 when switching on)
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: s
